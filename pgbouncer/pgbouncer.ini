[databases]
; every database on the managed Postgres 18 instance (private IP, same subnet)
* = host=<postgres-host> port=5432
; a one-connection pool, used only for the session-state drills
leakdemo = host=<postgres-host> port=5432 dbname=postgres pool_size=1

[pgbouncer]
; The measurements bound 0.0.0.0 on a private subnet whose firewall only let the
; benchmark client in. To reach the pooler from another machine, set this to the
; host's private address. Do not bind 0.0.0.0 on a host with a public IP address.
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = admin
stats_users = admin

pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 5
; 0 = unlimited, fine for a benchmark. In production, cap it below Postgres's
; max_connections minus the connections that bypass the pooler.
max_db_connections = 0
max_prepared_statements = 200
query_wait_timeout = 120
server_lifetime = 3600
server_idle_timeout = 600

ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
